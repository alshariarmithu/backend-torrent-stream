<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TorrentStream — UI</title>
  <style>
    body { font-family: system-ui, -apple-system, Arial, sans-serif; padding: 24px; max-width: 900px; margin: auto }
    h1 { font-size: 1.4rem }
    form { margin-bottom: 18px }
    input, button, select { padding: 8px 10px; margin: 6px 0; width: 100%; box-sizing: border-box }
    .row { display: flex; gap: 8px }
    .row input { flex: 1 }
    pre { background: #f6f8fa; padding: 12px; border-radius: 6px; overflow: auto }
    .result-card { padding: 10px; border-bottom: 1px solid #eee }
    .result-actions { display: flex; gap: 8px; align-items: center; margin-top: 8px }
    .result-actions a { font-size: 0.9rem }
    .result-actions button { width: auto; margin: 0 }
    .muted { color: #666; font-size: 0.92rem }
    #streamVideo { width: 100%; max-height: 460px; background: #000; border-radius: 10px; margin-top: 8px }
    #playerMeta { margin-top: 8px; font-size: 0.92rem }
  </style>
</head>
<body>
  <h1>TorrentStream — Basic UI</h1>

  <section>
    <h2>Register</h2>
    <form id="registerForm">
      <input id="regEmail" type="email" placeholder="Email" required />
      <input id="regPassword" type="password" placeholder="Password (min 8 chars)" required />
      <button type="submit">Register</button>
    </form>
  </section>

  <section>
    <h2>Login</h2>
    <form id="loginForm">
      <input id="loginEmail" type="email" placeholder="Email" required />
      <input id="loginPassword" type="password" placeholder="Password" required />
      <button type="submit">Login</button>
    </form>
  </section>

  <section>
    <h2>Auth Token</h2>
    <div style="display:flex;gap:8px;align-items:center">
      <input id="tokenInput" type="text" placeholder="Paste token here or use login" style="flex:1" />
      <button id="saveToken">Save</button>
      <button id="clearToken">Clear</button>
    </div>
    <p>Current token: <code id="currentToken">(none)</code></p>
  </section>

  <section>
    <h2>Search</h2>
    <form id="searchForm">
      <div class="row">
        <input id="searchQuery" type="search" placeholder="Search query" required />
        <select id="searchCategory">
          <option value="all">All</option>
          <option value="movies">Movies</option>
          <option value="tv">TV</option>
          <option value="4k">4K</option>
          <option value="music">Music</option>
          <option value="games">Games</option>
          <option value="apps">Apps</option>
        </select>
      </div>
      <button type="submit">Search</button>
    </form>
    <div id="results"></div>
  </section>

  <section>
    <h2>Stream Player Test</h2>
    <p class="muted">Click <strong>Prepare &amp; Play</strong> on a search result. Server will load torrent metadata, pick best video, scan subtitles, and return a stream link.</p>
    <video id="streamVideo" controls playsinline></video>
    <div id="playerMeta" class="muted">No stream loaded yet.</div>
  </section>

  <section>
    <h2>Response</h2>
    <pre id="out">No requests yet.</pre>
  </section>

  <script>
    const out = document.getElementById('out');
    const streamVideo = document.getElementById('streamVideo');
    const playerMeta = document.getElementById('playerMeta');
    let streamSocket = null;

    function getStoredToken(){
      return localStorage.getItem('ts_token') || '';
    }

    function setStoredToken(t){
      if(t){
        localStorage.setItem('ts_token', t);
      } else {
        localStorage.removeItem('ts_token');
      }
      renderToken();
    }

    function renderToken(){
      const t = getStoredToken();
      document.getElementById('currentToken').textContent = t ? t.slice(0,8) + '...' : '(none)';
      document.getElementById('tokenInput').value = t;
    }

    async function postJson(path, body, includeAuth = false){
      const headers = { 'Content-Type': 'application/json' };
      if(includeAuth){
        const t = getStoredToken();
        if(t) headers['Authorization'] = 'Bearer ' + t;
      }
      const res = await fetch(path, {
        method: 'POST',
        headers,
        body: JSON.stringify(body)
      });
      const text = await res.text();
      try{ return JSON.parse(text) }catch(e){ return text }
    }

    async function getJson(path, includeAuth = false){
      const headers = {};
      if(includeAuth){
        const t = getStoredToken();
        if(t) headers['Authorization'] = 'Bearer ' + t;
      }
      const res = await fetch(path, { headers });
      const text = await res.text();
      try{ return JSON.parse(text) }catch(e){ return text }
    }

    function escapeHtml(value){
      return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    function buildWsUrl(hash, magnet, token){
      const proto = window.location.protocol === 'https:' ? 'wss' : 'ws';
      return `${proto}://${window.location.host}/stream/ws?hash=${encodeURIComponent(hash)}&token=${encodeURIComponent(token)}`;
    }

    function closeStreamSocket(){
      if(streamSocket){
        try { streamSocket.close(); } catch (_) {}
        streamSocket = null;
      }
    }

    async function prepareAndPlay(hash, magnet, name){
      const token = getStoredToken();
      if(!token){
        alert('Login first or paste a token.');
        return;
      }

      closeStreamSocket();
      streamVideo.removeAttribute('src');
      streamVideo.load();

      playerMeta.textContent = `Preparing stream for: ${name}`;
      const wsUrl = buildWsUrl(hash, magnet, token);
      streamSocket = new WebSocket(wsUrl);

      streamSocket.onopen = () => {
        playerMeta.textContent = 'Socket connected. Fetching nodes and metadata…';
        try {
          streamSocket.send(JSON.stringify({ hash, magnet }));
        } catch (_) {}
      };

      streamSocket.onmessage = async (event) => {
        let message;
        try {
          message = JSON.parse(event.data);
        } catch (_) {
          return;
        }

        out.textContent = JSON.stringify(message, null, 2);

        if(message.type === 'status'){
          const pct = Math.round((message.progress || 0) * 100);
          const peers = message.num_peers || 0;
          playerMeta.textContent = `Fetching nodes… ${pct}% | peers: ${peers}`;
          return;
        }

        if(message.type === 'ready'){
          const playbackUrl = message.stream_url;
          const selectedVideo = message.selected_video?.name || '(unknown)';
          const subtitleCount = Array.isArray(message.subtitle_tracks) ? message.subtitle_tracks.length : 0;
          playerMeta.textContent = `Now playing: ${selectedVideo} | Subtitles: ${subtitleCount} | URL: ${playbackUrl}`;

          streamVideo.src = playbackUrl;
          streamVideo.load();
          try { await streamVideo.play(); } catch (_) {}
          closeStreamSocket();
          return;
        }

        if(message.type === 'error'){
          playerMeta.textContent = `Prepare failed: ${message.message || 'Unknown error'}`;
          closeStreamSocket();
          return;
        }

        if(message.type === 'need_magnet'){
          try {
            streamSocket.send(JSON.stringify({ hash, magnet }));
          } catch (_) {}
          return;
        }

        if(message.message){
          playerMeta.textContent = message.message;
        }
      };

      streamSocket.onerror = () => {
        playerMeta.textContent = 'Socket error while preparing stream.';
      };

      streamSocket.onclose = (evt) => {
        if(!streamVideo.currentSrc && evt.code !== 1000){
          playerMeta.textContent = `Socket closed (${evt.code}). Try again.`;
        }
      };
    }

    streamVideo.addEventListener('waiting', () => {
      playerMeta.textContent = 'Player buffering... waiting for torrent pieces.';
    });

    streamVideo.addEventListener('playing', () => {
      if(streamVideo.currentSrc){
        playerMeta.textContent = `Playing stream: ${streamVideo.currentSrc}`;
      }
    });

    streamVideo.addEventListener('error', () => {
      const mediaError = streamVideo.error;
      if(!mediaError){
        playerMeta.textContent = 'Playback failed: unknown media error.';
        return;
      }

      const codeMap = {
        1: 'MEDIA_ERR_ABORTED',
        2: 'MEDIA_ERR_NETWORK',
        3: 'MEDIA_ERR_DECODE',
        4: 'MEDIA_ERR_SRC_NOT_SUPPORTED',
      };
      playerMeta.textContent = `Playback failed: ${codeMap[mediaError.code] || mediaError.code}. If this keeps happening, try a torrent with MP4/MOV source and active seeders.`;
    });

    // register
    document.getElementById('registerForm').addEventListener('submit', async e =>{
      e.preventDefault();
      const email = document.getElementById('regEmail').value;
      const password = document.getElementById('regPassword').value;
      const r = await postJson('/auth/register', { email, password });
      out.textContent = JSON.stringify(r, null, 2);
      if(r && r.access_token){ setStoredToken(r.access_token); }
    });

    // login
    document.getElementById('loginForm').addEventListener('submit', async e =>{
      e.preventDefault();
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;
      const r = await postJson('/auth/login', { email, password });
      out.textContent = JSON.stringify(r, null, 2);
      if(r && r.access_token){ setStoredToken(r.access_token); }
    });

    // token controls
    document.getElementById('saveToken').addEventListener('click', ()=>{
      const v = document.getElementById('tokenInput').value.trim();
      setStoredToken(v);
    });
    document.getElementById('clearToken').addEventListener('click', ()=>{ setStoredToken(''); });

    // search
    function renderResults(data){
      const container = document.getElementById('results');
      if(!data || !data.data) { container.innerHTML = '<p>No results</p>'; return; }
      const items = data.data;
      container.innerHTML = items.map((i, idx) => `\n        <div class="result-card">\n          <strong>${escapeHtml(i.name)}</strong><br/>\n          Size: ${escapeHtml(i.size)} • Seeders: ${escapeHtml(i.seeders)} • Leechers: ${escapeHtml(i.leechers)}\n          <div class="result-actions">\n            <a href="${escapeHtml(i.magnet)}" target="_blank" rel="noopener">Magnet Link</a>\n            <button type="button" class="playBtn" data-idx="${idx}">Prepare &amp; Play</button>\n          </div>\n        </div>`).join('');

      container.querySelectorAll('.playBtn').forEach(btn => {
        btn.addEventListener('click', async () => {
          const idx = Number(btn.dataset.idx);
          const item = items[idx];
          if(!item) return;
          await prepareAndPlay(item.hash, item.magnet, item.name);
        });
      });
    }

    document.getElementById('searchForm').addEventListener('submit', async e =>{
      e.preventDefault();
      const q = document.getElementById('searchQuery').value.trim();
      const cat = document.getElementById('searchCategory').value;
      if(!q) return;
      const path = `/search/?query=${encodeURIComponent(q)}&category=${encodeURIComponent(cat)}`;
      const r = await getJson(path, true);
      out.textContent = JSON.stringify(r, null, 2);
      renderResults(r);
    });

    // initialize
    renderToken();
  </script>
</body>
</html>
